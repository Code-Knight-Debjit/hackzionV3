# docker-compose.yml
networks:
  hackzion_net:
    driver: bridge

volumes:
  db_data:        # Persistent SQLite volume

services:

  # ── Reverse Proxy ───────────────────────────────────────────────
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - hackzion_net
    restart: unless-stopped

  # ── Gateway (Risk Engine + Routing) ─────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    expose:
      - "8000"
    networks:
      - hackzion_net
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
      - honeypot
      - detection
      - response
      - api
    restart: unless-stopped

  # ── Real Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "9000"
    networks:
      - hackzion_net
    restart: unless-stopped

  # ── Honeypot ─────────────────────────────────────────────────────
  honeypot:
    build:
      context: .
      dockerfile: ./honeypot/Dockerfile
    expose:
      - "9001"
    networks:
      - hackzion_net
    volumes:
      - db_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db
    restart: unless-stopped

  # ── Detection Engine ─────────────────────────────────────────────
  detection:
    build:
      context: .
      dockerfile: ./detection/Dockerfile
    expose:
      - "8001"
    networks:
      - hackzion_net
    volumes:
      - db_data:/data          # ✅ FIX: mount shared DB volume
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db   # ✅ FIX: consistent DB path
    restart: unless-stopped
    ports:
      - "8001:8001"    # Exposed for direct curl access during testing (remove in production)
  # ── Response Engine ──────────────────────────────────────────────
  response:
    build:
      context: .
      dockerfile: ./response/Dockerfile
    expose:
      - "8002"
    networks:
      - hackzion_net
    volumes:
      - db_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db
    restart: unless-stopped
    ports:
      - "8002:8002"    # Exposed for direct curl access during testing

  # ── API Service ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    ports:
      - "8003:8003"    # Exposed for direct curl access during testing
    networks:
      - hackzion_net
    volumes:
      - db_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db
    restart: unless-stopped