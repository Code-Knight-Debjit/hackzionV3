# docker-compose.yml
networks:
  hackzion_net:
    driver: bridge

volumes:
  db_data:        # Persistent SQLite volume — shared across services

services:

  # ── Reverse Proxy ───────────────────────────────────────────────
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
    networks:
      - hackzion_net
    restart: unless-stopped

  # ── Gateway (Risk Engine + Routing) ─────────────────────────────
  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    expose:
      - "8000"
    networks:
      - hackzion_net
    environment:
      - PYTHONUNBUFFERED=1
    depends_on:
      - backend
      - honeypot
      - detection
      - response
      - api
    restart: unless-stopped

  # ── Real Backend ─────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "9000"
    networks:
      - hackzion_net
    restart: unless-stopped

  # ── Honeypot ─────────────────────────────────────────────────────
  honeypot:
    build:
      context: .
      dockerfile: ./honeypot/Dockerfile
    expose:
      - "9001"
    networks:
      - hackzion_net
    volumes:
      - db_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db
    restart: unless-stopped

  # ── Detection Engine ─────────────────────────────────────────────
  detection:
    build:
      context: .
      dockerfile: ./detection/Dockerfile
    expose:
      - "8001"
    networks:
      - hackzion_net
    volumes:
      - db_data:/data                  # ✅ Fixed (from previous session)
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db      # ✅ Fixed (from previous session)
    restart: unless-stopped
    ports:
      - "8001:8001"

  # ── Response Engine ──────────────────────────────────────────────
  response:
    build:
      context: .
      dockerfile: ./response/Dockerfile
    expose:
      - "8002"
    networks:
      - hackzion_net
    volumes:
      - db_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db
    restart: unless-stopped
    ports:
      - "8002:8002"

  # ── API Service ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    expose:
      - "8003"
    networks:
      - hackzion_net
    volumes:
      - db_data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - DB_PATH=/data/hackzion.db
    restart: unless-stopped
    ports:
      - "8003:8003"

  # ── Monitor App (Expo Web → nginx) ───────────────────────────────
  monitorapp:
    build:
      context: .
      dockerfile: ./monitorapp/Dockerfile
    ports:
      - "3000:3000"                    # Access dashboard at http://localhost:3000
    networks:
      - hackzion_net
    depends_on:
      - api
    restart: unless-stopped