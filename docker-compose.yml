# docker-compose.yml
version: "3.9"

networks:
  hackzion_net:
    driver: bridge

services:

  # ── Reverse Proxy (Nginx) ─────────────────────────────────────
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - gateway
      - backend
      - honeypot
    networks:
      - hackzion_net
    restart: unless-stopped

  # ── FastAPI Gateway (Risk Engine + Routing Decision) ──────────
  gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    expose:
      - "8000"
    networks:
      - hackzion_net
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # ── Real Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "9000"
    networks:
      - hackzion_net
    restart: unless-stopped

  # ── Honeypot Backend ──────────────────────────────────────────
  honeypot:
    build:
      context: ./honeypot
      dockerfile: Dockerfile
    expose:
      - "9001"
    networks:
      - hackzion_net
    restart: unless-stopped