# docker-compose.yml
networks:
  hackzion_net:
    driver: bridge

volumes:
  db_data:      # SQLite — existing services
  mongo_data:   # MongoDB — ai_analyzer
  ollama_data:  # Ollama model weights

services:

  proxy:
    build: { context: ./proxy, dockerfile: Dockerfile }
    ports: ["80:80"]
    depends_on: [gateway]
    networks: [hackzion_net]
    restart: unless-stopped

  gateway:
    build: { context: ., dockerfile: ./gateway/Dockerfile }
    expose: ["8000"]
    networks: [hackzion_net]
    environment: [PYTHONUNBUFFERED=1]
    depends_on: [backend, honeypot, detection, response, api, ai_analyzer]
    restart: unless-stopped

  backend:
    build: { context: ./backend, dockerfile: Dockerfile }
    expose: ["9000"]
    networks: [hackzion_net]
    restart: unless-stopped

  honeypot:
    build: { context: ., dockerfile: ./honeypot/Dockerfile }
    expose: ["9001"]
    volumes: [db_data:/data]
    networks: [hackzion_net]
    environment: [PYTHONUNBUFFERED=1, DB_PATH=/data/hackzion.db]
    restart: unless-stopped

  detection:
    build: { context: ., dockerfile: ./detection/Dockerfile }
    ports: ["8001:8001"]
    volumes: [db_data:/data]
    networks: [hackzion_net]
    environment: [PYTHONUNBUFFERED=1, DB_PATH=/data/hackzion.db]
    restart: unless-stopped

  response:
    build: { context: ., dockerfile: ./response/Dockerfile }
    ports: ["8002:8002"]
    volumes: [db_data:/data]
    networks: [hackzion_net]
    environment: [PYTHONUNBUFFERED=1, DB_PATH=/data/hackzion.db]
    restart: unless-stopped

  api:
    build: { context: ., dockerfile: ./api/Dockerfile }
    ports: ["8003:8003"]
    volumes: [db_data:/data]
    networks: [hackzion_net]
    environment: [PYTHONUNBUFFERED=1, DB_PATH=/data/hackzion.db]
    restart: unless-stopped

  # ── AI Analyzer (LLM + MongoDB) ──────────────────────────────────
  ai_analyzer:
    build: { context: ., dockerfile: ./ai_analyzer/Dockerfile }
    ports: ["8004:8004"]
    networks: [hackzion_net]
    environment:
      - PYTHONUNBUFFERED=1
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=hackzion
      - ALERT_API_URL=
      - ALERT_API_KEY=
    depends_on: [mongo, ollama]
    restart: unless-stopped

  # ── MongoDB ───────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    networks: [hackzion_net]
    restart: unless-stopped

  # ── Ollama (Llama3) ───────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]
    networks: [hackzion_net]
    restart: unless-stopped